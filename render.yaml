# Render blueprint — deploy the FastAPI backend with persistent SQLite.
# Docs: https://render.com/docs/blueprint-spec
#
# Persistent disk requires a paid plan (Starter or higher). Free tier cannot attach disks.
# After deploy, set CORS_ORIGINS to include your exact Vercel URL if needed.

services:
  - type: web
    name: simplifai-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    disk:
      name: simplifai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Absolute SQLite path on the persistent disk (four slashes after sqlite:)
      - key: DATABASE_URL
        value: sqlite:////var/data/simplifai.db
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: LLM_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
